name: iOS package build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-for-testing:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Compile package and test target for iOS Simulator
        run: >-
          xcodebuild
          build-for-testing
          -scheme StudyCoachCore
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
