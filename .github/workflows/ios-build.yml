name: iOS package build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-for-testing:
    name: build-for-testing (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Compile package and test target for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="$RUNNER_TEMP/studycoach-build.log"
          if xcodebuild \
            build-for-testing \
            -scheme StudyCoachCore \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            >"$LOG_FILE" 2>&1; then
            cat "$LOG_FILE"
          else
            while IFS= read -r diagnostic; do
              escaped="${diagnostic//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//$'\n'/'%0A'}"
              echo "::error title=Apple compile::$escaped"
            done < <(grep -E 'error:|warning:' "$LOG_FILE" | tail -60)
            cat "$LOG_FILE"
            exit 1
          fi

      - name: Compile PaperKit path with Swift 6 strict concurrency
        if: matrix.runner == 'macos-26'
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="$RUNNER_TEMP/studycoach-swift6-build.log"
          if xcodebuild \
            build-for-testing \
            -scheme StudyCoachCore \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/StudyCoach-Swift6-DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=6 \
            SWIFT_STRICT_CONCURRENCY=complete \
            >"$LOG_FILE" 2>&1; then
            cat "$LOG_FILE"
          else
            while IFS= read -r diagnostic; do
              escaped="${diagnostic//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//$'\n'/'%0A'}"
              echo "::error title=Swift 6 compile::$escaped"
            done < <(grep -E 'error:|warning:|fatal|signal|killed|Stack dump|Please submit|Command .* failed|BUILD FAILED' "$LOG_FILE" | tail -40)
            cat "$LOG_FILE"
            exit 1
          fi

      - name: Run unit tests on an iPad Simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(
            xcrun simctl list devices available --json |
            python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device.get("isAvailable") and device["name"].startswith("iPad")))'
          )"
          xcodebuild test \
            -scheme StudyCoachCore \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
